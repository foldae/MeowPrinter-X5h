[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meowprinter"
version = "1.1.0"
description = "Open-source thermal printer toolkit for BLE cat printers"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "bleak>=0.21",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
imaging = ["pillow>=10.0", "pyzbar>=0.1.9"]
all = ["meowprinter[imaging]"]

[project.scripts]
meowprinter = "meowprinter.api:run"
meowprinter-cli = "meowprinter.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100
